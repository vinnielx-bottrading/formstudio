<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form Studio · Tạo biểu mẫu</title>
<style>
:root{--ink:#232032;--muted:#716d80;--accent:#6553d6;--accent2:#efeaff;--bg:#f5f3fa;--card:#fff;--line:#e7e3ee;--bad:#ba3349;--good:#25845b;--shadow:0 10px 28px #2620470c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.bar{max-width:1120px;margin:auto;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-size:20px;font-weight:800;letter-spacing:-.05em;white-space:nowrap}.brand b{color:var(--accent)}.topname{font-weight:500;border:1px solid transparent;padding:8px 10px;border-radius:9px;min-width:150px;max-width:330px;flex:1}.topname:hover,.topname:focus{border-color:var(--line);outline:none}.save{color:var(--muted);font-size:12px;white-space:nowrap}.tabs{display:flex;gap:5px;max-width:1120px;margin:auto;padding:0 20px;overflow:auto}.tab{border:0;background:none;padding:12px 15px;color:var(--muted);font-weight:650;white-space:nowrap;border-bottom:3px solid transparent}.tab.active{color:var(--accent);border-color:var(--accent)}main{max-width:940px;margin:30px auto 90px;padding:0 18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 194px;gap:20px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px;margin-bottom:15px}.hero{border-top:9px solid var(--accent)}.banner-card{padding:0;overflow:hidden}.banner-image{display:block;width:100%;height:auto;max-height:390px;object-fit:cover}.banner-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:14px 18px}.banner-tools .field{flex:1;min-width:190px}.banner-hint{width:100%;font-size:12px;color:var(--muted)}.banner-empty{border:2px dashed #cfc8e7;background:#faf9ff;border-radius:13px;padding:22px;text-align:center;color:var(--muted)}.hero h1{font-size:29px;margin:0 0 4px;letter-spacing:-.035em}.muted{color:var(--muted)}.small{font-size:13px}.req{color:var(--bad)}.editor-input{border:0;border-bottom:1px solid transparent;border-radius:0;padding:8px 2px;width:100%;background:transparent;color:var(--ink)}.editor-input:focus{outline:0;border-bottom-color:var(--accent)}.title-in{font-size:28px;font-weight:750;letter-spacing:-.025em}.desc-in{resize:vertical;min-height:48px}.question{border-left:4px solid transparent}.question.selected{border-left-color:var(--accent)}.qtop{display:flex;gap:12px;align-items:center}.qtitle{font-weight:650;background:#f7f6fa;padding:12px;border-radius:8px}.type{min-width:155px;max-width:190px;border:1px solid var(--line);border-radius:9px;padding:10px;background:white}.options{padding-top:12px}.optionrow{display:flex;align-items:center;gap:8px;margin:6px 0}.optionrow .editor-input{max-width:450px}.shape{border:2px solid #aaa4bb;width:17px;height:17px;flex:none;border-radius:50%}.shape.check{border-radius:4px}.icon{border:0;background:transparent;color:#6c677c;padding:5px 9px;border-radius:7px;font-size:19px;line-height:1}.icon:hover{background:var(--accent2);color:var(--accent)}.add-option{border:0;background:none;color:var(--accent);padding:9px 3px}.qfoot{border-top:1px solid var(--line);margin-top:18px;padding-top:14px;display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.switch{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-left:8px}.switch input{accent-color:var(--accent)}.aside{position:sticky;top:112px}.aside .card{padding:15px}.aside h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}.action{width:100%;border:1px solid var(--line);background:#fff;text-align:left;padding:10px;border-radius:9px;margin-bottom:8px;color:var(--ink)}.action:hover{border-color:var(--accent);color:var(--accent)}.primary{border:0;border-radius:9px;background:var(--accent);color:white;padding:11px 17px;font-weight:650}.primary:hover{background:#5140be}.secondary{border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:10px 15px;font-weight:600}.secondary:hover{border-color:var(--accent);color:var(--accent)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.field{width:100%;padding:11px 12px;border:1px solid #d7d2e2;border-radius:9px;background:white;color:var(--ink)}.field:focus{outline:2px solid #dcd5ff;border-color:var(--accent)}textarea.field{min-height:100px;resize:vertical}.answer{margin-top:15px}.choice{display:flex;align-items:flex-start;gap:11px;margin:12px 0;cursor:pointer}.choice input{margin-top:5px;accent-color:var(--accent)}.error{font-size:13px;color:var(--bad);margin-top:8px;display:none}.invalid .error{display:block}.invalid .field{border-color:var(--bad)}.progress{height:6px;border-radius:6px;background:#e7e2f5;overflow:hidden;margin:0 0 18px}.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}.section-title{font-size:24px;margin:0 0 4px}.sectioncard{border-top:6px solid #ada3e8}.pill{background:var(--accent2);color:var(--accent);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}.section-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.empty{text-align:center;padding:40px 20px}.empty h2{margin:0}.response{padding:18px 20px}.response summary{cursor:pointer;font-weight:650}.response dl{margin-bottom:0}.response dt{color:var(--muted);font-size:13px;margin-top:13px}.response dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.footnote{color:var(--muted);font-size:12px;margin-top:16px}.section-edit{border-left:4px solid #aaa0ea}.media-box{margin-top:17px;padding:13px;background:#f8f7fc;border:1px solid var(--line);border-radius:11px}.media-view{margin:12px 0 2px}.media-view img,.media-view video,.media-view iframe{width:100%;max-height:420px;border:0;border-radius:10px;display:block;background:#171522;object-fit:contain}.media-view iframe{aspect-ratio:16/9}.media-view img.wide{aspect-ratio:3/1;object-fit:cover}.media-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.media-actions .field{flex:1;min-width:180px}.media-actions .secondary{padding:8px 10px}.media-caption{font-size:12px;color:var(--muted);margin:8px 0 0}.media-select{width:100%;max-width:275px;margin:8px 0 2px}.date-feedback{color:var(--good);font-size:13px;margin-top:8px;min-height:18px}.date-demo{max-width:290px;margin-top:9px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:750px){main{margin-top:18px}.layout{grid-template-columns:1fr}.aside{position:static;grid-row:1}.aside .card{margin-bottom:5px}.aside .actions{display:flex;gap:8px;overflow:auto}.aside .action{min-width:140px;margin:0}.qtop{flex-direction:column;align-items:stretch}.type{max-width:none}.card{padding:19px}.save{display:none}.topname{min-width:130px}}
</style>
</head>
<body>
<header class="top"><div class="bar"><div class="brand">form<b>studio</b></div><input id="topName" class="topname" aria-label="Tên biểu mẫu" placeholder="Biểu mẫu chưa có tên"><span id="saveState" class="save">Lưu trên thiết bị</span></div><nav class="tabs" aria-label="Chế độ"><button class="tab active" data-tab="build">Tạo biểu mẫu</button><button class="tab" data-tab="preview">Xem trước · Điền thử</button><button class="tab" data-tab="responses">Câu trả lời <span id="responseCount">0</span></button></nav></header>
<main id="app"></main>
<script>
(()=>{'use strict';
const STORE='form_studio_v1', RSTORE='form_studio_answers_v1';
const uid=()=>globalThis.crypto?.randomUUID?.()||'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
const initial=()=>({schemaVersion:1,id:uid(),banner:'',title:'Biểu mẫu chưa có tên',description:'Thêm mô tả để người trả lời biết mục đích của biểu mẫu.',items:[{id:uid(),kind:'question',type:'short',title:'Câu hỏi chưa có tiêu đề',required:false,options:[]}]});
function parse(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch{return fallback}}
let form=parse(STORE,initial());if(!form||!Array.isArray(form.items))form=initial();let responses=parse(RSTORE,[]);if(!Array.isArray(responses))responses=[];
let activeUrls=[];let tab='build',selected=form.items.find(x=>x.kind==='question')?.id||null,step=0,draft={},attempted=false;
const app=document.getElementById('app'),topName=document.getElementById('topName'),state=document.getElementById('saveState');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr=esc;const qById=id=>form.items.find(x=>x.id===id);
function persist(){try{localStorage.setItem(STORE,JSON.stringify(form));state.textContent='Đã lưu trên thiết bị'}catch{state.textContent='Không thể lưu tự động · hãy xuất JSON'}}
function saveAnswers(){try{localStorage.setItem(RSTORE,JSON.stringify(responses));return true}catch{return false}}
function download(name,content,mime){const blob=new Blob([content],{type:mime});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function mediaDb(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('Trình duyệt không hỗ trợ lưu video cục bộ.'));const req=indexedDB.open('form_studio_media_v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function mediaPut(id,blob){const db=await mediaDb();try{await new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{db.close()}}
async function mediaGet(id){const db=await mediaDb();try{return await new Promise((resolve,reject)=>{const tx=db.transaction('files','readonly');const req=tx.objectStore('files').get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}finally{db.close()}}
function youtubeLink(value){let url;try{url=new URL(value.trim())}catch{return null}if(!['https:','http:'].includes(url.protocol))return null;const host=url.hostname.toLowerCase().replace(/^www\./,'');let id='';if(host==='youtu.be')id=url.pathname.split('/')[1];else if(['youtube.com','m.youtube.com','youtube-nocookie.com'].includes(host)){if(url.pathname==='/watch')id=url.searchParams.get('v');else if(/^\/(shorts|embed)\//.test(url.pathname))id=url.pathname.split('/')[2]}return /^[A-Za-z0-9_-]{11}$/.test(id||'')?'https://www.youtube-nocookie.com/embed/'+id:null}
function mediaMode(item){return item.mediaMode||(!item.media?'none':item.media.kind==='youtube'?'youtube':item.media.kind==='video'?'video':item.media.display==='banner'?'banner':'image')}
function dateLabel(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return '';const [y,m,d]=value.split('-');return '✓ Đã chọn ngày '+d+'/'+m+'/'+y}
function mediaHtml(item){const m=item.media;if(!m)return '';if(m.kind==='image'&&/^(https?:\/\/|data:image\/(png|jpeg|webp);base64,)/i.test(m.src||''))return `<div class="media-view"><img src="${attr(m.src)}" alt="Hình ảnh cho câu hỏi" class="${m.display==='banner'?'wide':''}" loading="lazy"></div>`;if(m.kind==='youtube'){const src=youtubeLink(m.src)||(/^https:\/\/www\.youtube-nocookie\.com\/embed\/[A-Za-z0-9_-]{11}$/.test(m.src||'')?m.src:null);return src?`<div class="media-view"><iframe src="${attr(src)}" title="Video YouTube cho câu hỏi" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`:''}if(m.kind==='video'&&m.assetId)return `<div class="media-view"><video controls playsinline preload="metadata" data-video-asset="${attr(m.assetId)}">Trình duyệt không hỗ trợ video.</video></div>`;return ''}
async function attachVideos(){for(const video of app.querySelectorAll('[data-video-asset]')){const asset=video.dataset.videoAsset;try{const blob=await mediaGet(asset);if(!video.isConnected)return;if(!blob){video.replaceWith(Object.assign(document.createElement('p'),{textContent:'Không tìm thấy video cục bộ. Hãy tải lại video trong trang tạo biểu mẫu.'}));continue}const url=URL.createObjectURL(blob);activeUrls.push(url);video.src=url}catch{if(video.isConnected)video.replaceWith(Object.assign(document.createElement('p'),{textContent:'Không thể mở video đã lưu.'}))}}}
function videoDuration(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),video=document.createElement('video');video.preload='metadata';video.onloadedmetadata=()=>{URL.revokeObjectURL(url);resolve(video.duration)};video.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Không đọc được thời lượng video.'))};video.src=url})}
function imageData(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{try{const canvas=document.createElement('canvas'),ratio=Math.min(1,1600/img.width,1000/img.height);canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/webp',.78);if(data.length>1_400_000)throw Error('Ảnh vẫn quá lớn sau khi nén.');resolve(data)}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Không đọc được ảnh.'))};img.src=url})}
async function fileData(blob){return await new Promise((resolve,reject)=>{const reader=new FileReader;reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob)})}
function safeName(s){return (s||'bieu_mau').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w-]+/g,'_').slice(0,55)}
function setTab(t){tab=t;step=0;draft={};attempted=false;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function sections(){const arr=[{id:'intro',title:form.title,description:form.description,questions:[]}];for(const item of form.items){if(item.kind==='section')arr.push({id:item.id,title:item.title||'Phần chưa có tiêu đề',description:item.description||'',questions:[]});else arr.at(-1).questions.push(item)}return arr}
function add(kind='question',type='short',after=selected){const item=kind==='section'?{id:uid(),kind:'section',title:'Phần mới',description:''}:{id:uid(),kind:'question',type,title:'Câu hỏi chưa có tiêu đề',required:false,options:['single','multi','dropdown'].includes(type)?['Lựa chọn 1']:[]};const i=form.items.findIndex(x=>x.id===after);form.items.splice(i<0?form.items.length:i+1,0,item);selected=item.id;persist();render();document.querySelector('[data-id="'+item.id+'"]')?.scrollIntoView({behavior:'smooth',block:'center'})}
function editorItem(it,index){if(it.kind==='section')return `<article class="card section-edit" data-id="${attr(it.id)}"><div class="section-controls"><span class="pill">Phần mới · ${sections().findIndex(s=>s.id===it.id)+1}</span><div><button class="icon" data-act="up" title="Lên trên" aria-label="Chuyển lên">↑</button><button class="icon" data-act="down" title="Xuống dưới" aria-label="Chuyển xuống">↓</button><button class="icon" data-act="delete" title="Xóa phần" aria-label="Xóa phần">×</button></div></div><input class="editor-input title-in" data-field="title" value="${attr(it.title)}" aria-label="Tiêu đề phần"><textarea class="editor-input desc-in" data-field="description" aria-label="Mô tả phần" placeholder="Mô tả phần (không bắt buộc)">${esc(it.description)}</textarea></article>`;
const opts=it.options||[];return `<article class="card question ${selected===it.id?'selected':''}" data-id="${attr(it.id)}"><div class="qtop"><input class="editor-input qtitle" data-field="title" aria-label="Nội dung câu hỏi" value="${attr(it.title)}" placeholder="Nhập câu hỏi"><select class="type" data-field="type" aria-label="Loại câu hỏi">${[['short','Trả lời ngắn'],['long','Đoạn văn'],['single','Một lựa chọn'],['multi','Nhiều lựa chọn'],['dropdown','Danh sách'],['date','Ngày']].map(([v,l])=>`<option value="${v}" ${it.type===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="media-box"><label class="small muted" for="media_${attr(it.id)}" style="font-weight:650">Đính kèm nội dung minh họa</label><select class="type media-select" id="media_${attr(it.id)}" data-field="mediaMode" aria-label="Chọn banner, ảnh hoặc video"><option value="none" ${mediaMode(it)==='none'?'selected':''}>Không đính kèm</option><option value="banner" ${mediaMode(it)==='banner'?'selected':''}>Banner ngang</option><option value="image" ${mediaMode(it)==='image'?'selected':''}>Hình ảnh</option><option value="video" ${mediaMode(it)==='video'?'selected':''}>Video tải lên</option><option value="youtube" ${mediaMode(it)==='youtube'?'selected':''}>Video YouTube</option></select>${mediaMode(it)==='none'?'':`<div class="media-actions">${['banner','image'].includes(mediaMode(it))?`<button class="secondary" data-act="media-upload-${mediaMode(it)}">↑ Tải ${mediaMode(it)==='banner'?'banner':'ảnh'}</button><input class="field" data-media-link type="url" placeholder="Hoặc URL ảnh https://…" aria-label="URL ảnh"><button class="secondary" data-act="media-apply-link">Dùng link</button>`:mediaMode(it)==='video'?'<button class="secondary" data-act="media-upload-video">↑ Tải video MP4 / WebM</button>':'<input class="field" data-media-link type="url" placeholder="Dán link YouTube…" aria-label="Link YouTube"><button class="secondary" data-act="media-apply-link">Nhúng video</button>'}${it.media?'<button class="secondary" data-act="media-remove">Gỡ nội dung</button>':''}</div>${mediaHtml(it)}<div class="media-caption">${mediaMode(it)==='video'?'Video tối đa 2 phút, 30 MB.':mediaMode(it)==='youtube'?'Video YouTube cần có Internet để phát.':'Gợi ý banner ngang 3:1; có thể tải ảnh hoặc dùng URL.'}</div><input type="file" data-media-file accept="image/png,image/jpeg,image/webp,video/mp4,video/webm" hidden>`}</div><div class="options">${['single','multi','dropdown'].includes(it.type)?opts.map((o,i)=>`<div class="optionrow" data-opt="${i}"><span class="shape ${it.type==='multi'?'check':''}"></span><input class="editor-input" data-option="${i}" aria-label="Lựa chọn ${i+1}" value="${attr(o)}" placeholder="Lựa chọn ${i+1}"><button class="icon" data-act="remove-option" data-index="${i}" title="Xóa lựa chọn" aria-label="Xóa lựa chọn">×</button></div>`).join('')+`<button class="add-option" data-act="add-option">+ Thêm lựa chọn</button>`:`<div class="small muted" style="padding:10px 2px">${it.type==='long'?'Người trả lời sẽ nhập một đoạn văn.':it.type==='date'?'<input class=\"field date-demo\" type=\"date\" data-demo-date aria-label=\"Chọn thử ngày\"><div class=\"date-feedback\" data-date-feedback></div>':'Người trả lời sẽ nhập nội dung.'}</div>`}</div><div class="qfoot"><button class="icon" data-act="up" title="Lên trên" aria-label="Chuyển lên">↑</button><button class="icon" data-act="down" title="Xuống dưới" aria-label="Chuyển xuống">↓</button><button class="icon" data-act="duplicate" title="Nhân bản" aria-label="Nhân bản">⧉</button><button class="icon" data-act="delete" title="Xóa câu hỏi" aria-label="Xóa câu hỏi">♲</button><label class="switch"><input type="checkbox" data-field="required" ${it.required?'checked':''}> Bắt buộc</label></div></article>`}
function renderBuild(){app.innerHTML=`<div class="layout"><div><article class="card banner-card">${form.banner?`<img class="banner-image" src="${attr(form.banner)}" alt="Banner của biểu mẫu">`:'<div class="banner-empty">Thêm banner chương trình phía trên tiêu đề</div>'}<div class="banner-tools"><button class="secondary" data-act="upload-banner">↑ Tải ảnh banner</button><input id="bannerUrl" class="field" type="url" placeholder="Hoặc dán URL ảnh https://…" value="${attr(form.banner?.startsWith('http')?form.banner:'')}" aria-label="URL ảnh banner"><button class="secondary" data-act="apply-banner-url">Dùng URL</button>${form.banner?'<button class="secondary" data-act="remove-banner">Xóa banner</button>':''}<div class="banner-hint">Gợi ý ảnh ngang tỷ lệ 3:1; ảnh tải lên được nén để lưu cùng biểu mẫu.</div></div><input id="bannerFile" type="file" accept="image/png,image/jpeg,image/webp" hidden></article><article class="card hero"><input class="editor-input title-in" id="formTitle" value="${attr(form.title)}" aria-label="Tiêu đề biểu mẫu" placeholder="Tiêu đề biểu mẫu"><textarea class="editor-input desc-in" id="formDescription" aria-label="Mô tả biểu mẫu" placeholder="Mô tả biểu mẫu">${esc(form.description)}</textarea><div class="small req" style="margin-top:10px">* Câu hỏi bắt buộc</div></article>${form.items.map(editorItem).join('')}<div class="toolbar"><button class="secondary" data-act="add-question">+ Thêm câu hỏi</button><button class="secondary" data-act="add-section">+ Thêm phần</button></div></div><aside class="aside"><div class="card"><h3>Công cụ</h3><div class="actions"><button class="action" data-act="add-question">＋ Câu hỏi</button><button class="action" data-act="add-section">▤ Thêm phần</button><button class="action" data-act="export-form">↓ Xuất cấu trúc JSON</button><button class="action" data-act="import-form">↑ Nhập cấu trúc JSON</button></div><p class="footnote">Thay đổi được lưu trên trình duyệt này. Xuất JSON để sao lưu biểu mẫu, gồm cả video đã tải lên. Dung lượng tệp có thể lớn.</p></div><input type="file" id="importFile" accept="application/json,.json" hidden></aside></div>`}
function responseField(q){const value=draft[q.id];const id=attr(q.id);switch(q.type){case 'long':return `<textarea class="field" data-answer="${id}" placeholder="Câu trả lời của bạn">${esc(value||'')}</textarea>`;case 'date':return `<input class="field" type="date" data-answer="${id}" aria-label="Chọn ngày cho ${attr(q.title)}" value="${attr(value||'')}"><div class="date-feedback" data-date-feedback aria-live="polite">${dateLabel(value)}</div>`;case 'single':case 'multi':return (q.options||[]).map((o,i)=>`<label class="choice"><input type="${q.type==='multi'?'checkbox':'radio'}" name="q_${id}" data-answer="${id}" value="${attr(o)}" ${q.type==='multi'?(Array.isArray(value)&&value.includes(o)?'checked':''):value===o?'checked':''}><span>${esc(o||'Lựa chọn '+(i+1))}</span></label>`).join('')||'<span class="muted small">Câu hỏi chưa có lựa chọn.</span>';case 'dropdown':return `<select class="field" data-answer="${id}"><option value="">Chọn câu trả lời</option>${(q.options||[]).map(o=>`<option value="${attr(o)}" ${value===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;default:return `<input class="field" type="text" data-answer="${id}" value="${attr(value||'')}" placeholder="Câu trả lời của bạn">`}}
function valid(q){const v=draft[q.id];return !q.required||(Array.isArray(v)?v.length>0:String(v??'').trim().length>0)}
function renderPreview(){const ss=sections();if(step>=ss.length)step=ss.length-1;const section=ss[step];app.innerHTML=`<div style="max-width:720px;margin:auto"><div class="progress" aria-label="Tiến độ"><i style="width:${Math.round((step+1)/ss.length*100)}%"></i></div>${form.banner?`<div class="card banner-card"><img class="banner-image" src="${attr(form.banner)}" alt="Banner của biểu mẫu"></div>`:''}<article class="card hero"><div class="small muted">Phần ${step+1} / ${ss.length}</div><h1>${esc(form.title||'Biểu mẫu chưa có tên')}</h1><div class="muted" style="white-space:pre-wrap">${esc(form.description)}</div></article>${step>0?`<article class="card sectioncard"><h2 class="section-title">${esc(section.title)}</h2><div class="muted" style="white-space:pre-wrap">${esc(section.description)}</div></article>`:''}${section.questions.map(q=>`<article class="card ${attempted&&!valid(q)?'invalid':''}" data-id="${attr(q.id)}"><div style="font-weight:650">${esc(q.title||'Câu hỏi chưa có tiêu đề')} ${q.required?'<span class="req">*</span>':''}</div>${mediaHtml(q)}<div class="answer">${responseField(q)}</div><div class="error">Vui lòng trả lời câu hỏi này.</div></article>`).join('')}${!section.questions.length?'<article class="card muted">Phần này chưa có câu hỏi.</article>':''}<div class="toolbar" style="justify-content:space-between"><button class="secondary" data-act="previous" ${step===0?'disabled':''}>Quay lại</button><button class="primary" data-act="next">${step===ss.length-1?'Gửi câu trả lời':'Tiếp theo'}</button></div><p class="footnote">Bản V1: câu trả lời được lưu trong trình duyệt của thiết bị này.</p></div>`}
function renderResponses(){app.innerHTML=`<div style="max-width:760px;margin:auto"><article class="card hero"><h1>Câu trả lời</h1><p class="muted">${responses.length} lượt trả lời được lưu trên thiết bị này.</p><div class="toolbar"><button class="secondary" data-act="export-csv" ${responses.length?'':'disabled'}>Xuất CSV</button><button class="secondary" data-act="export-answers" ${responses.length?'':'disabled'}>Xuất JSON</button><button class="secondary" data-act="clear-answers" ${responses.length?'':'disabled'}>Xóa tất cả câu trả lời</button></div></article>${responses.length?responses.slice().reverse().map((r,i)=>`<details class="card response"><summary>Lượt trả lời ${responses.length-i} · ${esc(new Date(r.submittedAt).toLocaleString('vi-VN'))}</summary><dl>${Object.entries(r.answers||{}).map(([id,value])=>`<dt>${esc(r.labels?.[id]||qById(id)?.title||id)}</dt><dd>${esc(Array.isArray(value)?value.join(', '):value||'—')}</dd>`).join('')}</dl></details>`).join(''):'<article class="card empty"><h2>Chưa có câu trả lời</h2><p class="muted">Mở tab “Xem trước · Điền thử” để kiểm tra biểu mẫu.</p></article>'}</div>`}
function render(){for(const url of activeUrls)URL.revokeObjectURL(url);activeUrls=[];topName.value=form.title;document.getElementById('responseCount').textContent=responses.length;if(tab==='build')renderBuild();else if(tab==='preview')renderPreview();else renderResponses();attachVideos()}
function validatePage(){const qs=sections()[step].questions;attempted=true;render();const bad=qs.find(q=>!valid(q));if(bad){app.querySelector('.invalid')?.scrollIntoView({behavior:'smooth',block:'center'});return false}return true}
function submit(){const labels=Object.fromEntries(form.items.filter(x=>x.kind==='question').map(q=>[q.id,q.title]));const answers={};for(const q of form.items.filter(x=>x.kind==='question'))answers[q.id]=draft[q.id]??(q.type==='multi'?[]:'');responses.push({id:uid(),formId:form.id,submittedAt:new Date().toISOString(),labels,answers});const saved=saveAnswers();document.getElementById('responseCount').textContent=responses.length;app.innerHTML=`<div style="max-width:720px;margin:auto"><article class="card hero empty"><div style="font-size:45px;color:var(--good)">✓</div><h1>Đã ghi nhận câu trả lời</h1><p class="muted">${saved?'Câu trả lời đã được lưu trên thiết bị này.':'Trình duyệt không cho phép lưu lâu dài; hãy xuất câu trả lời ngay.'}</p><div class="toolbar" style="justify-content:center"><button class="secondary" data-act="again">Gửi câu trả lời khác</button><button class="primary" data-act="show-responses">Xem câu trả lời</button></div></article></div>`;draft={};step=0;attempted=false}
function csv(){const ids=[...new Set(responses.flatMap(r=>Object.keys(r.answers||{})))];const labels=ids.map(id=>responses.slice().reverse().find(r=>r.labels?.[id])?.labels[id]||id);const quote=v=>'"'+String(Array.isArray(v)?v.join('; '):v??'').replace(/"/g,'""')+'"';const rows=[['ID','Thời gian',...labels],...responses.map(r=>[r.id,r.submittedAt,...ids.map(id=>r.answers?.[id]??'')])];download(safeName(form.title)+'_cau_tra_loi.csv','\ufeff'+rows.map(row=>row.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function cleanMedia(m){if(!m||typeof m!=='object')return null;if(m.kind==='image'&&typeof m.src==='string'&&m.src.length<1500000&&/^(https?:\/\/|data:image\/(png|jpeg|webp);base64,)/i.test(m.src))return {kind:'image',src:m.src,display:m.display==='banner'?'banner':'image'};if(m.kind==='youtube'){const src=youtubeLink(m.src||'');return src?{kind:'youtube',src}:null}if(m.kind==='video'&&typeof m.videoData==='string'&&/^data:video\/(mp4|webm);base64,/i.test(m.videoData)&&m.videoData.length<44000000)return {kind:'video',assetId:uid(),videoData:m.videoData};return null}
function normalizeImported(data){if(!data||!Array.isArray(data.items))throw Error('Tệp không có cấu trúc biểu mẫu hợp lệ.');if(data.items.length>300)throw Error('Biểu mẫu có quá nhiều mục.');const allowed=['short','long','single','multi','dropdown','date'];const items=data.items.map(item=>item.kind==='section'?{id:uid(),kind:'section',title:String(item.title||'Phần mới').slice(0,500),description:String(item.description||'').slice(0,5000)}:{id:uid(),kind:'question',type:allowed.includes(item.type)?item.type:'short',title:String(item.title||'Câu hỏi').slice(0,500),required:!!item.required,options:Array.isArray(item.options)?item.options.slice(0,100).map(o=>String(o).slice(0,500)):[],media:cleanMedia(item.media),mediaMode:['none','banner','image','video','youtube'].includes(item.mediaMode)?item.mediaMode:undefined});return {schemaVersion:1,id:uid(),title:String(data.title||'Biểu mẫu chưa có tên').slice(0,300),description:String(data.description||'').slice(0,5000),banner:typeof data.banner==='string'&&(/^(https?:\/\/|data:image\/(png|jpeg|webp);base64,)/i).test(data.banner)&&data.banner.length<1500000?data.banner:'',items}}
app.addEventListener('focusin',e=>{const card=e.target.closest('.question,.section-edit');if(card)selected=card.dataset.id});
app.addEventListener('input',e=>{const el=e.target;if(tab==='build'&&el.matches('[data-demo-date]')){el.closest('.options').querySelector('[data-date-feedback]').textContent=dateLabel(el.value)}else if(tab==='build'){if(el.id==='formTitle'){form.title=el.value;topName.value=form.title;persist()}else if(el.id==='formDescription'){form.description=el.value;persist()}else if(el.dataset.option!==undefined){const q=qById(el.closest('[data-id]').dataset.id);q.options[Number(el.dataset.option)]=el.value;persist()}else if(el.dataset.field){const q=qById(el.closest('[data-id]').dataset.id);q[el.dataset.field]=el.value;persist()}}else if(tab==='preview'&&el.dataset.answer){const q=qById(el.dataset.answer);if(q.type==='multi')draft[q.id]=[...app.querySelectorAll('[data-answer="'+CSS.escape(q.id)+'"]:checked')].map(x=>x.value);else draft[q.id]=el.value;el.closest('.card')?.classList.remove('invalid');if(q.type==='date')el.closest('.card')?.querySelector('[data-date-feedback]')?.replaceChildren(document.createTextNode(dateLabel(el.value)))}});
app.addEventListener('change',e=>{const el=e.target;if(tab==='build'&&el.dataset.field){const q=qById(el.closest('[data-id]').dataset.id);if(el.dataset.field==='mediaMode'){const mode=el.value;q.mediaMode=mode;if(mode==='none'||(q.media&&((mode==='youtube')!==(q.media.kind==='youtube')||(mode==='video')!==(q.media.kind==='video')||(mode==='banner'||mode==='image')&&q.media.kind==='image'&&q.media.display!==mode)))q.media=null;persist();render()}else if(el.dataset.field==='type'){q.type=el.value;if(['single','multi','dropdown'].includes(q.type)&&!q.options?.length)q.options=['Lựa chọn 1'];persist();render()}else if(el.dataset.field==='required'){q.required=el.checked;persist()}}else if(tab==='build'&&el.matches('[data-demo-date]')){el.closest('.options').querySelector('[data-date-feedback]').textContent=dateLabel(el.value)}else if(tab==='preview'&&el.dataset.answer){const q=qById(el.dataset.answer);if(q.type==='multi')draft[q.id]=[...app.querySelectorAll('[data-answer="'+CSS.escape(q.id)+'"]:checked')].map(x=>x.value);else draft[q.id]=el.value;el.closest('.card')?.classList.remove('invalid');if(q.type==='date')el.closest('.card')?.querySelector('[data-date-feedback]')?.replaceChildren(document.createTextNode(dateLabel(el.value)))}});
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,card=b.closest('[data-id]'),item=card&&qById(card.dataset.id);if(act==='add-question')add('question');else if(act==='add-section')add('section');else if(act==='add-option'){item.options.push('Lựa chọn '+(item.options.length+1));persist();render()}else if(act==='remove-option'){item.options.splice(Number(b.dataset.index),1);persist();render()}else if(act==='delete'){if(!confirm(item.kind==='section'?'Xóa phần này? Câu hỏi bên dưới sẽ chuyển vào phần trước.':'Xóa câu hỏi này?'))return;form.items.splice(form.items.indexOf(item),1);selected=form.items.find(x=>x.kind==='question')?.id||null;persist();render()}else if(act==='duplicate'){const copy=structuredClone(item);copy.id=uid();form.items.splice(form.items.indexOf(item)+1,0,copy);selected=copy.id;persist();render()}else if(act==='up'||act==='down'){const i=form.items.indexOf(item),j=i+(act==='up'?-1:1);if(j>=0&&j<form.items.length){[form.items[i],form.items[j]]=[form.items[j],form.items[i]];persist();render()}}else if(act==='media-upload-banner'||act==='media-upload-image'||act==='media-upload-video'){const picker=card.querySelector('[data-media-file]');picker.accept=act==='media-upload-video'?'video/mp4,video/webm':'image/png,image/jpeg,image/webp';picker.dataset.mode=act==='media-upload-banner'?'banner':'image';picker.click()}else if(act==='media-apply-link'){const value=card.querySelector('[data-media-link]').value.trim();const mode=mediaMode(item),yt=youtubeLink(value);if(mode==='youtube'&&yt)item.media={kind:'youtube',src:yt};else if(['image','banner'].includes(mode)&&/^https?:\/\//i.test(value))item.media={kind:'image',src:value,display:mode};else{alert(mode==='youtube'?'Nhập link YouTube hợp lệ.':'Nhập URL ảnh http(s) hợp lệ.');return}persist();render()}else if(act==='media-remove'){item.media=null;persist();render()}else if(act==='upload-banner')document.getElementById('bannerFile').click();else if(act==='apply-banner-url'){const url=document.getElementById('bannerUrl').value.trim();if(url&&!/^https?:\/\//i.test(url)){alert('Vui lòng dùng URL bắt đầu bằng http:// hoặc https://');return}form.banner=url;persist();render()}else if(act==='remove-banner'){form.banner='';persist();render()}else if(act==='export-form'){(async()=>{try{const output=structuredClone(form);for(const q of output.items){if(q.media?.kind==='video'){const blob=await mediaGet(q.media.assetId);if(!blob)throw Error('Không tìm thấy video của câu hỏi: '+q.title);q.media.videoData=await fileData(blob)}}download(safeName(form.title)+'.json',JSON.stringify(output,null,2),'application/json')}catch(err){alert('Không xuất được biểu mẫu: '+err.message)}})()}else if(act==='import-form')document.getElementById('importFile').click();else if(act==='previous'){step--;attempted=false;render()}else if(act==='next'){if(!validatePage())return;if(step<sections().length-1){step++;attempted=false;render();window.scrollTo({top:0,behavior:'smooth'})}else submit()}else if(act==='again')setTab('preview');else if(act==='show-responses')setTab('responses');else if(act==='export-csv')csv();else if(act==='export-answers')download(safeName(form.title)+'_cau_tra_loi.json',JSON.stringify(responses,null,2),'application/json');else if(act==='clear-answers'){if(confirm('Xóa toàn bộ câu trả lời trên thiết bị này? Hành động này không thể hoàn tác.')){responses=[];saveAnswers();render()}}});
app.addEventListener('change',async e=>{if(e.target.matches('[data-media-file]')){const file=e.target.files?.[0];if(!file)return;const q=qById(e.target.closest('[data-id]').dataset.id);try{if(['image/png','image/jpeg','image/webp'].includes(file.type)){if(file.size>12_000_000)throw Error('Ảnh cần nhỏ hơn 12 MB.');const data=await imageData(file);const old=q.media;q.media={kind:'image',src:data,display:e.target.dataset.mode==='banner'?'banner':'image'};try{localStorage.setItem(STORE,JSON.stringify(form))}catch(err){q.media=old;throw Error('Không đủ dung lượng lưu ảnh trong trình duyệt.')}state.textContent='Đã lưu trên thiết bị'}else if(['video/mp4','video/webm'].includes(file.type)){if(file.size>30_000_000)throw Error('Video cần nhỏ hơn 30 MB.');if(await videoDuration(file)>120)throw Error('Video cần dài tối đa 2 phút.');const id=uid();await mediaPut(id,file);q.media={kind:'video',assetId:id};persist()}else throw Error('Chọn ảnh PNG/JPG/WebP hoặc video MP4/WebM.');render()}catch(err){alert('Không thêm được media: '+err.message)}return}if(e.target.id==='bannerFile'){const file=e.target.files?.[0];if(!file)return;try{if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Chọn ảnh PNG, JPG hoặc WebP.');if(file.size>12_000_000)throw Error('Ảnh cần nhỏ hơn 12 MB.');const source=URL.createObjectURL(file);try{const img=new Image();img.src=source;await img.decode();const canvas=document.createElement('canvas');const scale=Math.min(1,1600/img.width,800/img.height);canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/webp',.8);if(data.length>1_400_000)throw Error('Ảnh sau khi nén vẫn quá lớn; vui lòng dùng ảnh nhỏ hơn.');form.banner=data;persist();render()}finally{URL.revokeObjectURL(source)}}catch(err){alert('Không thêm được banner: '+err.message)}return}if(e.target.id!=='importFile')return;const file=e.target.files?.[0];if(!file)return;try{if(file.size>300_000_000)throw Error('Tệp JSON quá lớn.');const imported=normalizeImported(JSON.parse(await file.text()));if(!confirm('Thay biểu mẫu hiện tại bằng biểu mẫu trong tệp JSON? Các câu trả lời hiện có vẫn được giữ.'))return;for(const q of imported.items){if(q.media?.videoData){const response=await fetch(q.media.videoData);await mediaPut(q.media.assetId,await response.blob());delete q.media.videoData}}form=imported;selected=form.items.find(x=>x.kind==='question')?.id||null;persist();render()}catch(err){alert('Không nhập được biểu mẫu: '+err.message)}});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});topName.addEventListener('input',()=>{form.title=topName.value;persist();if(tab==='build'){const input=document.getElementById('formTitle');if(input)input.value=form.title}});render();
})();
</script>
